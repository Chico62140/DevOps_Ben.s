apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-ben
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-ben
  template:
    metadata:
      labels:
        app: flask-ben
    spec:
      containers:
        - name: flask-ben
          image: chico871/flask-ben:1.0.0
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          resources:
            requests:
              cpu: "100m"
            limits:
              cpu: "500m"
          envFrom:
            - configMapRef:
                name: flask-ben-config
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1
